<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ShadowLab — Profile</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/profile.css">
    </head>
    <body>
        <div class="app-shell">
            <header class="topbar">
                <a class="brand" href="index.html" aria-label="ShadowLab home">
                    <span class="brand-mark">S</span>
                    <span class="brand-copy"><strong>shadowlab</strong><small>security research platform</small></span>
                </a>
                <nav class="main-nav" aria-label="Основная навигация">
                    <a href="index.html" class="nav-link" data-page="dashboard">Dashboard</a>
                    <a href="laboratory.html" class="nav-link" data-page="lab">Laboratory</a>
                    <a href="history.html" class="nav-link" data-page="history">History</a>
                    <a href="projects.html" class="nav-link" data-page="projects">Projects</a>
                </nav>
                <div class="topbar-actions">
                    <span class="status-pill"><span class="status-dot"></span> System ready</span>
                    <button class="icon-btn" title="Notifications" aria-label="Notifications">⌁</button>
                    <a class="profile-chip" href="profile.html" title="Open profile"><span class="avatar">AK</span><span class="profile-name">Arseni.</span><span class="chevron">⌄</span></a>
                </div>
            </header>
            <main class="page-wrap">
                <section class="page" id="page-profile">
                    <div class="page-heading">
                        <div>
                            <p class="eyebrow">Account</p>
                            <h1>Profile</h1>
                            <p class="muted">Workspace preferences and access settings.</p>
                        </div>
                    </div>
                    <div class="profile-grid">
                        <article class="panel profile-card">
                            <div class="large-avatar">AK</div>
                            <h3>Arseni.</h3>
                            <p class="muted">Researcher account</p>
                            <div class="profile-badges"><span class="badge badge-orange">Lab access</span><span class="badge badge-outline">MFA enabled</span></div>
                        </article>
                        <article class="panel settings-card">
                            <div class="panel-head">
                                <div>
                                    <p class="eyebrow">Settings</p>
                                    <h3>Workspace</h3>
                                </div>
                            </div>
                            <label>
                                Display name
                                <input value="Arseni.">
                            </label>
                            <label>
                                Email
                                <input value="arseni@example.local">
                            </label>
                            <label>
                                Default project
                                <select>
                                    <option>Web Security Lab</option>
                                    <option>Research Sandbox</option>
                                </select>
                            </label>
                            <button class="btn btn-primary">Save changes</button>
                        </article>
                    </div>
                </section>
            </main>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-dot"></span><span id="toastText">Ready</span></div>
        <script src="js/main.js"></script>
    </body>
</html>
